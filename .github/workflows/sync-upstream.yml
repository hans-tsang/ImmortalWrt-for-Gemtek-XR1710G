name: Sync Upstream ImmortalWrt

on:
  schedule:
    - cron: '0 19 */3 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-sync-master
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Check for updates
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/master)
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "No updates available (upstream: ${REMOTE:0:7}, local: ${LOCAL:0:7})"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates available: ${LOCAL:0:7} -> ${REMOTE:0:7}"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          handoff_and_stop() {
            local reason="${1:-}"
            if [ -n "$reason" ]; then
              if ! HANDOFF_REASON="$reason" bash scripts/handoff-sync-conflicts.sh; then
                echo "::warning::The sync-conflict branch was pushed, but GitHub Actions could not open a PR or issue automatically."
              fi
            elif ! bash scripts/handoff-sync-conflicts.sh; then
              echo "::warning::The sync-conflict branch was pushed, but GitHub Actions could not open a PR or issue automatically."
            fi
            echo "SYNC_BLOCKED=1" >> "$GITHUB_ENV"
            exit 0
          }
          git merge --no-edit upstream/master || {
            echo "Merge reported conflicts, attempting automatic resolution for local customizations."
            bash scripts/resolve-sync-conflicts.sh
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Merge failed. Handing the conflicts to the Copilot coding agent."
              handoff_and_stop
            fi
            git commit --no-edit
          }

      - name: Enforce no-Chinese content
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${SYNC_BLOCKED:-}" = "1" ]; then
            echo "Sync was already handed off on a sync-conflict branch; skipping no-Chinese enforcement."
            exit 0
          fi
          if ! bash scripts/enforce-no-chinese.sh; then
            echo "The merged tree still violates the no-Chinese policy - handing it to the Copilot coding agent."
            if ! HANDOFF_REASON="Upstream added Chinese text that merged cleanly and still needs to be translated." \
              bash scripts/handoff-sync-conflicts.sh; then
              echo "::warning::The sync-conflict branch was pushed, but GitHub Actions could not open a PR or issue automatically."
            fi
            echo "SYNC_BLOCKED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: enforce no-Chinese content policy"
          fi

      - name: Push to origin
        if: steps.check.outputs.has_updates == 'true'
        run: |
          if [ "${SYNC_BLOCKED:-}" = "1" ]; then
            echo "Sync was already handed off on a sync-conflict branch; skipping push to origin."
            exit 0
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push rejected, re-merging origin/master and retrying ($attempt/3)."
            git fetch origin master
            git merge --no-edit origin/master || exit 1
            sleep 5
          done
          exit 1

      - name: Show result
        if: always()
        run: |
          echo "=== Sync Result ==="
          git log --oneline -5 || true
          echo "=== Remote Status ==="
          git remote -v || true
