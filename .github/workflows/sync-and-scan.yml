name: Sync Upstream and Scan Firmware

# ---------------------------------------------------------------------------
# This workflow lives in hans-tsang/ImmortalWrt-for-Gemtek-XR1710G, a fork of
# naoki66/ImmortalWrt-for-Gemtek-XR1710G.
#
# 1. Sync job pulls new commits from upstream naoki66/master into this fork's
#    master branch.
# 2. If anything changed, build job compiles firmware from source in a clean
#    Ubuntu runner (never trusts a pre-built binary).
# 3. Scan job runs EMBA (fetched fresh from its own official repo) against
#    the freshly-built image and fails the workflow if high/critical
#    findings show up.
#
# SETUP REQUIRED (Settings -> Actions -> General):
#   - Workflow permissions -> "Read and write permissions" (so sync can push)
#
# OPTIONAL repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   UPSTREAM_REPO   (defaults to naoki66/ImmortalWrt-for-Gemtek-XR1710G below)
#   UPSTREAM_BRANCH (defaults to master below)
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 18 * * *'   # once a day, 18:00 UTC = 02:00 HKT
  workflow_dispatch:        # lets you click "Run workflow" manually
    inputs:
      force_build:
        description: Run build and scan even when sync finds no upstream changes
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'naoki66/ImmortalWrt-for-Gemtek-XR1710G' }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'master' }}
  TARGET_BRANCH: master

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream

      - name: Compare HEADs
        id: diff
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into fork
        id: sync
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if git merge --no-edit upstream/${{ env.UPSTREAM_BRANCH }}; then
            bash scripts/enforce-no-chinese.sh
            if ! git diff --quiet; then
              git add -A
              git commit -m "chore: enforce no-Chinese content policy"
            fi
            if [ "$(git rev-parse HEAD)" != "${{ steps.diff.outputs.local }}" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              git push origin ${{ env.TARGET_BRANCH }}
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Merge conflict — needs manual review. Failing job."
            exit 1
          fi

  build-firmware:
    needs: sync-fork
    if: ${{ needs.sync-fork.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_build) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - name: Checkout updated fork
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Prepare build configuration
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh
          bash scripts/enforce-no-chinese.sh
          cp config.seed .config
          bash scripts/set-build-version.sh .config
          make defconfig

      - name: Download sources
        run: make download -j2

      - name: Build firmware
        id: build
        run: |
          make -j2 world 2>&1 | tee build.log
          ARTIFACT=$(find bin/targets/airoha/an7581 -maxdepth 1 -type f \( -name "*gemtek_xr1710g*sysupgrade*.itb" -o -name "*gemtek_xr1710g*.itb" -o -name "*.bin" \) | head -n1)
          if [ -z "$ARTIFACT" ]; then
            echo "::error::No firmware image was produced."
            ls -la bin/targets/airoha/an7581/ 2>/dev/null || true
            exit 1
          fi
          echo "artifact_name=$(basename "$ARTIFACT")" >> "$GITHUB_OUTPUT"
          mkdir -p scan-input
          cp "$ARTIFACT" scan-input/

      - name: Summarize build output
        if: always()
        run: |
          if [ -f build.log ]; then
            bash scripts/summarize-build-errors.sh build.log || true
            tail -100 build.log
          fi
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || true

      - name: Upload built firmware for scanning
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-image
          path: scan-input/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14

  scan-firmware:
    needs: build-firmware
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download built firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-image
          path: scan-input

      - name: Checkout EMBA
        uses: actions/checkout@v6
        with:
          repository: e-m-b-a/emba
          path: emba

      - name: Run EMBA installer (non-interactive)
        run: |
          cd emba
          sudo ./installer.sh -d || true

      - name: Run EMBA scan
        run: |
          cd emba
          FIRMWARE_FILE=$(find ../scan-input -type f | head -n1)
          sudo ./emba -f "$FIRMWARE_FILE" -l ../emba-report -p ./scan-profiles/default-scan.emba

      - name: Upload EMBA report
        uses: actions/upload-artifact@v4
        with:
          name: emba-report
          path: emba-report/
          retention-days: 30

      - name: Check for high severity findings
        run: |
          CSV="emba-report/csv_logs/f20_vuln_aggregator.csv"
          if [ -f "$CSV" ]; then
            if grep -qi "high\|critical" "$CSV"; then
              echo "::warning::High or critical severity findings detected — review the emba-report artifact."
              exit 1
            fi
          fi
