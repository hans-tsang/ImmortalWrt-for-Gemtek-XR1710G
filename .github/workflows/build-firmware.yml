name: Build XR1710G Firmware

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - release
          - prerelease
      release_notes:
        description: 'Release Notes'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate build version
        id: version
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch --no-tags upstream master

          build_date=$(TZ=Asia/Shanghai date +'%Y%m%d')
          repo_commit=$(git rev-parse --short=10 HEAD)
          upstream_base=$(git merge-base HEAD upstream/master)
          upstream_commit=$(git rev-parse --short=10 "$upstream_base")
          build_id="${build_date}-${repo_commit}-${upstream_commit}"
          version_number="$build_id"
          version_code="${repo_commit}-${upstream_commit}"

          echo "date=$build_date" >> $GITHUB_OUTPUT
          echo "build_id=$build_id" >> $GITHUB_OUTPUT
          echo "repo_commit=$repo_commit" >> $GITHUB_OUTPUT
          echo "upstream_commit=$upstream_commit" >> $GITHUB_OUTPUT
          echo "version_number=$version_number" >> $GITHUB_OUTPUT
          echo "version_code=$version_code" >> $GITHUB_OUTPUT
          echo "Build version: ImmortalWrt naoki66 $version_number"

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Apply feed patches
        run: FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh

      - name: Configure
        run: |
          bash scripts/enforce-no-chinese.sh
          cp config.seed .config
          BUILD_DATE='${{ steps.version.outputs.date }}' \
          BUILD_ID='${{ steps.version.outputs.build_id }}' \
          REPO_COMMIT='${{ steps.version.outputs.repo_commit }}' \
          UPSTREAM_COMMIT='${{ steps.version.outputs.upstream_commit }}' \
          VERSION_NUMBER='${{ steps.version.outputs.version_number }}' \
          VERSION_CODE='${{ steps.version.outputs.version_code }}' \
          bash scripts/set-build-version.sh .config
          make defconfig
          grep -E 'CONFIG_(IMAGEOPT|EXTRA_IMAGE_NAME|VERSIONOPT|VERSION_DIST|VERSION_NUMBER|VERSION_CODE)=' .config

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build Firmware
        shell: bash
        run: |
          make -j2 world 2>&1 | tee build.log

      - name: Check build status
        if: always()
        run: |
          if [ -f build.log ]; then
            bash scripts/summarize-build-errors.sh build.log || true
            tail -100 build.log
          fi
          echo "=== List all files in bin/targets/airoha/an7581/ ==="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "No files found in an7581 directory"
          echo "=== List all files in bin/targets/airoha/ ==="
          ls -la bin/targets/airoha/ 2>/dev/null || echo "No files found in airoha directory"
          echo "=== List all files in bin/targets/ ==="
          ls -la bin/targets/ 2>/dev/null || echo "No files found in targets directory"
          echo "=== List all files in bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No files found in bin directory"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xr1710g-firmware
          path: |
            build.log
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*.manifest
            bin/targets/airoha/an7581/profiles.json
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
          retention-days: 30
        if: always()

      - name: Build release body
        if: github.event.inputs.release_type != 'none'
        id: release_body
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          BUILD_DATE: ${{ steps.version.outputs.date }}
          BUILD_ID: ${{ steps.version.outputs.build_id }}
          REPO_COMMIT: ${{ steps.version.outputs.repo_commit }}
          UPSTREAM_COMMIT: ${{ steps.version.outputs.upstream_commit }}
        run: |
          image_path=$(ls bin/targets/airoha/an7581/*sysupgrade*.itb 2>/dev/null | head -n1)
          image_name=$(basename "${image_path:-unknown}")
          image_sha=""
          if [ -n "$image_path" ]; then
            image_sha=$(sha256sum "$image_path" | cut -d' ' -f1)
          fi

          {
            echo "## What this is"
            echo
            echo "A ready-to-flash ImmortalWrt firmware image for the **Gemtek XR1710G**"
            echo "(Airoha AN7581). It was built by GitHub Actions from this repository, so"
            echo "you do not need to compile anything yourself."
            echo
            echo "## What to download"
            echo
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| \`$image_name\` | The firmware. This is the file you flash. |"
            echo "| \`sha256sums\` | Checksums, so you can verify the download is not corrupted. |"
            echo "| \`*.manifest\` | The list of packages included in the firmware. |"
            echo "| \`profiles.json\` | Device/image metadata used by tools such as the firmware selector. |"
            echo "| \`config.buildinfo\`, \`feeds.buildinfo\`, \`version.buildinfo\` | The exact build settings, feeds and version used, for reproducing this build. |"
            echo
            echo "## How to install"
            echo
            echo "1. Download the \`.itb\` file and \`sha256sums\`."
            echo "2. Check the download: run \`sha256sum -c sha256sums --ignore-missing\` in the download folder."
            echo "   The expected checksum of the firmware is \`${image_sha:-see sha256sums}\`."
            echo "3. If the router already runs ImmortalWrt/OpenWrt, go to"
            echo "   *System -> Backup / Flash Firmware -> Flash new firmware image* and upload the \`.itb\`,"
            echo "   or run \`sysupgrade -v /tmp/$image_name\` over SSH."
            echo "4. Do not power off the router while it is flashing. It reboots on its own when done."
            echo
            echo "Keep settings only when upgrading from a previous build of this same repository."
            echo "Coming from vendor firmware or a very different build? Flash without keeping settings."
            echo
            echo "## Build details"
            echo
            echo "- Build date: \`$BUILD_DATE\` (Asia/Shanghai)"
            echo "- Firmware version string: \`ImmortalWrt naoki66 $BUILD_ID\`"
            echo "- This repository commit: \`$REPO_COMMIT\`"
            echo "- ImmortalWrt upstream commit it is based on: \`$UPSTREAM_COMMIT\`"
            echo "- The firmware in this release was really built from those commits by the"
            echo "  *Build XR1710G Firmware* workflow; it is not a notes-only release."
            echo
            if [ -n "${RELEASE_NOTES//[[:space:]]/}" ]; then
              echo "## Changes in this build"
              echo
              printf '%s\n' "$RELEASE_NOTES"
              echo
            fi
            echo "## Warning"
            echo
            echo "This is community firmware for a specific device. Flashing the wrong file can"
            echo "make the router unusable, and recovery may need a serial console. Use it only if"
            echo "you are comfortable with that risk."
          } > /tmp/release_body.md
          {
            echo "body<<RELEASE_BODY_EOF"
            cat /tmp/release_body.md
            echo "RELEASE_BODY_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event.inputs.release_type != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('{0}-{1}', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          name: ${{ format('{0} - XR1710G Build ({1})', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*.manifest
            bin/targets/airoha/an7581/profiles.json
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
